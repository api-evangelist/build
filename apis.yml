name: Build
description: 'Build is an AI-native operating partner for the built world, pairing autonomous
  AI agents (its "Dougie" platform) with deep domain expertise to accelerate commercial
  real estate and infrastructure development. The platform automates mission-critical
  development workflows including site selection, due diligence, underwriting, investment-committee
  memos, test-fit analysis, market and zoning research, environmental diligence, and ESG
  reporting. Build serves institutional clients across data centers, industrials, energy,
  power, office, telecommunications, mixed-use, hotels, and multifamily. Backed by Index
  Ventures; profiled in the API Evangelist network. Build is a services company and does
  not currently publish a public developer API.'
